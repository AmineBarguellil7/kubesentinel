name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default token permissions: read-only. The build job asks for more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Install each service and check that it starts and answers /health.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: demo-api
            port: 3000
          - service: demo-orders
            port: 3001
          - service: demo-payments
            port: 3002

    # Only demo-orders uses Redis (its /health pings it). Service containers
    # can't be switched on per matrix entry, so the other two just ignore it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - run: npm ci

      - name: Smoke check /health
        env:
          # Dummy env: the upstream URLs are never called by /health.
          PORT: ${{ matrix.port }}
          REDIS_URL: redis://localhost:6379
          PAYMENTS_URL: http://localhost:3002
          ORDERS_URL: http://localhost:3001
        run: |
          npm start &

          # Give the service up to ~15s to answer 200 on /health.
          for attempt in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT/health" || true)
            if [ "$status" = "200" ]; then
              echo "/health returned 200 after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done

          echo "::error::/health never returned 200 (last status: $status)"
          exit 1

  # ---------------------------------------------------------------------------
  # 2. Build each Docker image. Push to GHCR only for pushes to main.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        service: [demo-api, demo-orders, demo-payments]
    env:
      IMAGE: ghcr.io/aminebarguellil7/kubesentinel-${{ matrix.service }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE }}:latest
          # Reuse Docker layers between runs.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------------------
  # 3. Bring the whole stack up with docker compose and do one real checkout.
  # ---------------------------------------------------------------------------
  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --wait blocks until every container reports healthy.
      - name: Start the stack
        run: docker compose up --build --wait

      - name: POST /checkout and expect 201
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' \
            -X POST http://localhost:3000/checkout \
            -H 'Content-Type: application/json' \
            -d '{"item":"laptop","amount":999}')

          echo "HTTP $status"
          cat response.json; echo

          if [ "$status" != "201" ]; then
            echo "::error::expected 201 from /checkout, got $status"
            exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down

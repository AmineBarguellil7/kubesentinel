apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: demo
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      # Skip the legacy REDIS_PORT=tcp://... style env vars Kubernetes injects for every Service.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          image: kubesentinel-demo-orders:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: PAYMENTS_URL
              value: http://payments:3002
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          # /livez skips the Redis check: a Redis outage must not restart this pod.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: demo
  labels:
    app: orders
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 3001
      targetPort: http
